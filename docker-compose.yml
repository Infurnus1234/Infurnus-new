services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: infurnus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: infurnus
      POSTGRES_USER: infurnus
      POSTGRES_PASSWORD: infurnus_dev
    ports:
      - '5432:5432'
    volumes:
      - infurnus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U infurnus -d infurnus']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: infurnus-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - infurnus_redis_data:/data

volumes:
  infurnus_postgres_data:
  infurnus_redis_data:
