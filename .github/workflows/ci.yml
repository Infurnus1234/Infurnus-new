name: CI

on:
  push:
    branches:
      - main
      - architecture
      - 'integration/**'
  pull_request:
    branches:
      - main
      - architecture

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: infurnus
          POSTGRES_DB: infurnus
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U infurnus -d infurnus"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://infurnus@localhost:5434/infurnus
      NODE_ENV: test
      RIDE_DB_TESTS: 'true'
      MAP_REDIS_TESTS: 'true'
      DRIVER_IMPLEMENTATION_DB_TESTS: 'true'
      PROVIDER_DB_TESTS: 'true'
      COUPON_DB_TESTS: 'true'
      RENTAL_DB_TESTS: 'true'
      RIDE_LOAD_TESTS: 'true'
      REDIS_URL: redis://localhost:6379
      GOOGLE_MAPS_API_KEY: non-secret-ci-fixture-key

      JWT_ACCESS_SECRET: ${{ secrets.CI_JWT_ACCESS_SECRET }}
      JWT_ACCESS_PREVIOUS_SECRET: ${{ secrets.CI_JWT_ACCESS_PREVIOUS_SECRET }}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      AUTH_OTP_ENCRYPTION_KEY: ${{ secrets.CI_AUTH_OTP_ENCRYPTION_KEY }}

      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.3.0

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=moderate

      - name: Secret and private-artifact scan
        run: node scripts/check-source-secrets.js

      - name: Run database migrations
        run: npm run migrate

      - name: Validate clean-database migrations
        run: npm run test:migrations

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [[ "$base" == "0000000000000000000000000000000000000000" || -z "$base" ]]; then
            base="$(git merge-base HEAD origin/main)"
          fi
          git diff --name-only --diff-filter=ACMRTUXB "$base" "${{ github.sha }}" > /tmp/changed-files
          mapfile -t files < <(grep -E '\.(js|jsx|ts|tsx|json|jsonc|md|yml|yaml|css|scss|html)$' /tmp/changed-files || true)
          if ((${#files[@]})); then
            npx prettier --check "${files[@]}"
          fi

      - name: Test
        run: npm test -- --maxWorkers=4

      - name: Build
        run: npm run build
