name: CI

on:
  push:
    branches:
      - main
      - architecture
      - 'integration/**'
  pull_request:
    branches:
      - main
      - architecture

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: infurnus
          POSTGRES_DB: infurnus
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U infurnus -d infurnus"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://infurnus@localhost:5434/infurnus
      NODE_ENV: test
      FCM_AUDIT_DB_TESTS: 'true'
      RIDE_DB_TESTS: 'true'
      MAP_REDIS_TESTS: 'true'
      REDIS_DISPATCH_TESTS: 'true'
      DISPATCH_QA_REDIS_URL: redis://127.0.0.1:6379
      DRIVER_IMPLEMENTATION_DB_TESTS: 'true'
      PROVIDER_DB_TESTS: 'true'
      COUPON_DB_TESTS: 'true'
      RENTAL_DB_TESTS: 'true'
      RIDE_LOAD_TESTS: 'true'
      REDIS_URL: redis://localhost:6379
      GOOGLE_MAPS_API_KEY: non-secret-ci-fixture-key

      JWT_ACCESS_SECRET: ${{ secrets.CI_JWT_ACCESS_SECRET }}
      JWT_ACCESS_PREVIOUS_SECRET: ${{ secrets.CI_JWT_ACCESS_PREVIOUS_SECRET }}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      AUTH_OTP_ENCRYPTION_KEY: ${{ secrets.CI_AUTH_OTP_ENCRYPTION_KEY }}

      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.3.0

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=moderate

      - name: Secret and private-artifact scan
        run: node scripts/check-source-secrets.js

      - name: Create owned disposable integration database
        run: |
          node --input-type=module <<'NODE'
          import { randomUUID } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          import { Pool } from 'pg';
          const name = 'admin_master_test_' + randomUUID().replaceAll('-', '');
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          await pool.query('CREATE DATABASE "' + name + '"');
          await pool.end();
          const url = new URL(process.env.DATABASE_URL);
          url.pathname = '/' + name;
          appendFileSync(process.env.GITHUB_ENV, 'DATABASE_URL=' + url.toString() + '\n');
          NODE

      - name: Run database migrations
        run: npm run migrate

      - name: Validate clean-database migrations
        run: npm run test:migrations

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [[ "$base" == "0000000000000000000000000000000000000000" || -z "$base" ]]; then
            base="$(git merge-base HEAD origin/main)"
          fi
          git diff --name-only --diff-filter=ACMRTUXB "$base" "${{ github.sha }}" > /tmp/changed-files
          mapfile -t files < <(grep -E '\.(js|jsx|ts|tsx|json|jsonc|md|yml|yaml|css|scss|html)$' /tmp/changed-files || true)
          if ((${#files[@]})); then
            npx prettier --check "${files[@]}"
          fi

      - name: Test
        run: npm test -- --maxWorkers=4

      - name: Test optional storage without credentials
        shell: bash
        run: |
          unset CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET
          npm test -- src/infrastructure/storage/storage.configuration.test.ts --maxWorkers=1

      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format changed Dart files
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            dart format --output=none --set-exit-if-changed lib test
          else
            git diff --name-only --diff-filter=ACMRTUXB "$base" "${{ github.sha }}" -- '*.dart' > /tmp/changed-dart
            mapfile -t files < <(sed 's|^frontend/||' /tmp/changed-dart)
            if ((${#files[@]})); then
              dart format --output=none --set-exit-if-changed "${files[@]}"
            fi
          fi
      - name: Static analysis
        run: flutter analyze --no-pub
      - name: Tests
        run: flutter test --no-pub
      - name: Web production build
        run: flutter build web --release --no-pub
      - name: Configure Android test resources
        working-directory: .
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.CUSTOMER_ANDROID_GOOGLE_SERVICES_JSON }}
        run: node scripts/configure-ci-firebase.mjs frontend
      - name: Android test build
        env:
          INFURNUS_TEST_RELEASE_SIGNING: 'true'
          MAPS_API_KEY: ${{ secrets.CUSTOMER_MAPS_API_KEY || 'non-secret-ci-fixture-key' }}
        run: flutter build apk --release --no-pub
