name: CI

on:
  push:
    branches:
      - main
      - architecture
  pull_request:
    branches:
      - main
      - architecture

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: infurnus
          POSTGRES_DB: infurnus
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U infurnus -d infurnus"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://infurnus@localhost:5432/infurnus
      JWT_ACCESS_SECRET: ci-test-secret-at-least-32-characters-long
      JWT_ACCESS_PREVIOUS_SECRET: ci-previous-secret-at-least-32-characters-long
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.3.0

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        shell: bash
        run: |
          for migration in migrations/*.sql; do
            echo "Running $migration"
            psql \
              -h localhost \
              -p 5432 \
              -U infurnus \
              -d infurnus \
              -v ON_ERROR_STOP=1 \
              -f "$migration"
          done

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
